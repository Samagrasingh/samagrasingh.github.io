<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Strategic Intelligence Platform</title>
  <style>
    :root { --bg: #0e1420; --ink: #e8edf5; --muted: #9aa7ba; --accent: #4c6fff; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 2rem; text-align: center;
    }
    h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); margin-bottom: 0.75rem; }
    p { color: var(--muted); max-width: 40ch; margin: 0 auto 1.5rem; line-height: 1.6; }
    .links { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block; padding: 0.7rem 1.4rem; border-radius: 0.5rem;
      text-decoration: none; font-weight: 600;
    }
    a.primary { background: var(--accent); color: #fff; }
    a.secondary { border: 1px solid var(--muted); color: var(--ink); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn't exist or has moved.</p>
    <div class="links">
      <a class="primary" href="/">Back to the home page</a>
      <a class="secondary" href="https://strategic-intelligence-platform-uyl.vercel.app/dashboard">Open live platform</a>
    </div>
  </main>
</body>
</html>
